[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosh"
version = "0.1.0"
description = "Model-driven Open Security Harness for agent-coordinated application security discovery and testing."
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai==1.14.7",
    "markdown-it-py>=4.2,<5",
    "reportlab>=4.4,<5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mosh = "mosh.cli:main"
mosh-web = "mosh.web:main"

[dependency-groups]
dev = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mosh*"]

[tool.setuptools.package-data]
mosh = ["crews/**/*.yaml", "web.css", "web.js", "favicon.ico"]
